# CI for the standalone plugin repo.
#
# Covers the layers that run without the toolkit devcontainer:
# lint, unit tests, wheel build, frontend lint/test/build.
#
# Integration and Playwright E2E tests need a running InvenTree server,
# Postgres, and the demo dataset — run those locally via test-all.sh
# inside the InvenTree Plugin AI Toolkit devcontainer.

name: CI

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e .
          pip install ruff pytest build "django~=5.2" djangorestframework

      - name: Lint
        run: |
          ruff check flat_bom_generator
          ruff format --check flat_bom_generator

      - name: Unit tests
        run: python -m pytest flat_bom_generator/tests/unit -v

      - name: Build wheel
        run: python -m build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build
