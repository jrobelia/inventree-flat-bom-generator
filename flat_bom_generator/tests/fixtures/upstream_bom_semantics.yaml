# Fixture for upstream BOM semantics tests (ticket #14).
#
# Structure:
#   SEM-TLA (8100) - unsourced assembly root
#   +- Bracket Weldment A (8101) x1 - unsourced assembly
#   |   +- Steel Bar (8103) 500mm x4 pieces        -> 2000mm
#   +- Bracket Weldment B (8102) x1 - unsourced assembly
#   |   +- Steel Bar (8103) 500mm x2 pieces        -> 1000mm (merges to 500x6)
#   |   +- Square Tube (8104) 500mm x4 pieces      -> 2000mm
#   |   +- Square Tube (8104) 250mm x8 pieces      -> 2000mm (separate entry)
#   +- Linear Rail (8105) 500mm x1 piece           -> 500mm   (500 x 1)
#   +- M8 Bolt (8106) 10 each x5 pieces            -> 50 each (no cut entry)
#   +- Epoxy (8107) 2 ml x1 - Part.consumable=True, line flag False
#   +- Dowel Pin (8130) 10pcs x3 under A and under B -> merged row emits
#     piece_count=1 (#44: uniform per-line counts cannot describe the
#     lump; R-025 as amended)
#
#   Template Weldment WELD-T (8110) - is_template, assembly
#   +- Bracket (8120) x2 inherited:true   -> propagates to variant
#   +- Hidden Line (8122) x9 inherited:false -> stays off variant BOM
#   +- Gasket (8131) x2 inherited:true    -> also direct on variant; the
#     merged row renders 'WELD-T, local' (#45 ruling, superseding R-025's
#     disagreement-null)
#   Variant WELD-V (8111) - variant_of=8110, assembly
#   +- Cover (8121) x1 - direct line (inherited_from null)
#   +- Gasket (8131) x1 - direct line beside the inherited one
#   BomItemSubstitute on the inherited bracket line -> Alt Bracket (8123)
#
# piece_count is upstream BomItem semantics: quantity is the size of one
# piece, piece_count is how many pieces. Line total = quantity x
# piece_count x ancestor multiplier.
- model: part.partcategory
  pk: 8100
  fields:
    name: 'Upstream Semantics'
    description: 'Category for upstream BOM semantics tests'
    default_location: null
    parent: null
    tree_id: 8100
    level: 0
    lft: 1
    rght: 2

