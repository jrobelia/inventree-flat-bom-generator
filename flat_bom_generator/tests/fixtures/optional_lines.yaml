# Optional BOM-line Test Fixtures (issue #30)
# Created: November 11, 2026
# Purpose: Exercise the include_optional toggle end to end - pruning at the
# traversal seam, the optional_qty partition, and cut-list omission.
#
# BOM shape (OPT-ROOT 9201):
#   +- PART-REQ        9202  x2  required
#   +- PART-OPT-ONLY   9203  x3  optional
#   +- SUB-OPT         9204  x1  optional      (assembly)
#   |    +- PART-SUB-LEAF  9205  x4  required line - optional by path
#   |    +- PART-MIXED     9206  x1  required line - optional by path
#   +- PART-MIXED      9206  x1  required      (same part, second occurrence)
#   +- PART-BAR-OPT    9207  x500 optional     (length line -> cut list)
#   +- SUB-ALLOPT      9208  x1  required      (assembly)
#        +- PART-SUBLEAF-OPT 9209  x2  optional
#
# include_optional=true (default):
#   9202 total 2  opt 0   | 9203 total 3  opt 3 | 9205 total 4 opt 4
#   9206 total 2  opt 1   | 9207 total 500 opt 500 (cut 500x1)
#   9209 total 2  opt 2
# include_optional=false:
#   9202 total 2  opt 0   | 9206 total 1  opt 0
#   SUB-ALLOPT emits nothing - no leaf, no assembly_no_children warning.
#
# Part IDs: 9200-9209; BomItem IDs: 9201-9209

