# Fixture for internal-supplier expansion tests (ticket #6).
#
# Structure:
#   TLA (8001)
#   +- Fab Assembly (8002)  x2  - primary supplier = internal company
#   |   +- Steel Plate (8003) x3
#   +- Purchased Assembly (8004) x1 - primary supplier = external company
#   |   +- Hidden Child (8005) x1
#   +- Unsourced Assembly (8006) x1 - purchaseable but NO supplier
#       +- Loose Screw (8007) x4
#
# Primary suppliers are SupplierPart rows flagged primary: true.
- model: part.partcategory
  pk: 8001
  fields:
    name: 'Expansion Test'
    description: 'Category for internal-supplier expansion tests'
    default_location: null
    parent: null
    tree_id: 8001
    level: 0
    lft: 1
    rght: 2

- model: company.company
  pk: 8001
  fields:
    name: 'External Supplier Co'
    description: 'Ordinary external supplier'
    is_supplier: true
    is_manufacturer: false
    is_customer: false
    is_internal: false
    active: true

- model: company.company
  pk: 8002
  fields:
    name: 'In-House Fab Shop'
    description: 'Internal fabrication supplier'
    is_supplier: true
    is_manufacturer: false
    is_customer: false
    is_internal: true
    active: true

- model: part.part
  pk: 8001
  fields:
    name: 'Expansion TLA'
    IPN: 'EXPL-TLA'
    description: 'Top-level assembly'
    category: 8001
    active: true
    assembly: true
    purchaseable: false
    salable: false
    is_template: false
    units: ''
    tree_id: 8001
    level: 0
    lft: 1
    rght: 2

- model: part.part
  pk: 8002
  fields:
    name: 'In-House Fab Assembly'
    IPN: 'EXPL-IFAB'
    description: 'Assembly made by the internal shop'
    category: 8001
    active: true
    assembly: true
    purchaseable: true
    salable: false
    is_template: false
    units: 'pcs'
    tree_id: 8002
    level: 0
    lft: 1
    rght: 2

- model: part.part
  pk: 8003
  fields:
    name: 'Steel Plate'
    IPN: 'EXPL-STL'
    description: 'Cut stock for the fab assembly'
    category: 8001
    active: true
    assembly: false
    purchaseable: true
    salable: false
    is_template: false
    units: 'mm'
    tree_id: 8003
    level: 0
    lft: 1
    rght: 2

- model: part.part
  pk: 8004
  fields:
    name: 'Purchased Assembly'
    IPN: 'EXPL-PASSY'
    description: 'Assembly bought complete from external supplier'
    category: 8001
    active: true
    assembly: true
    purchaseable: true
    salable: false
    is_template: false
    units: 'pcs'
    tree_id: 8004
    level: 0
    lft: 1
    rght: 2

- model: part.part
  pk: 8005
  fields:
    name: 'Hidden Child'
    IPN: 'EXPL-HID'
    description: 'Child of the purchased assembly - not expected in flat BOM'
    category: 8001
    active: true
    assembly: false
    purchaseable: true
    salable: false
    is_template: false
    units: 'pcs'
    tree_id: 8005
    level: 0
    lft: 1
    rght: 2

- model: part.part
  pk: 8006
  fields:
    name: 'Unsourced Assembly'
    IPN: 'EXPL-UNSRC'
    description: 'Assembly with children but no primary supplier'
    category: 8001
    active: true
    assembly: true
    purchaseable: true
    salable: false
    is_template: false
    units: 'pcs'
    tree_id: 8006
    level: 0
    lft: 1
    rght: 2

- model: part.part
  pk: 8007
  fields:
    name: 'Loose Screw'
    IPN: 'EXPL-SCRW'
    description: 'Child of the unsourced assembly'
    category: 8001
    active: true
    assembly: false
    purchaseable: true
    salable: false
    is_template: false
    units: 'pcs'
    tree_id: 8007
    level: 0
    lft: 1
    rght: 2

# SupplierParts - primary suppliers drive internal/external detection
- model: company.supplierpart
  pk: 8001
  fields:
    part: 8002
    supplier: 8002  # In-House Fab Shop (is_internal=true)
    primary: true
    SKU: 'IFAB-001'
    active: true

- model: company.supplierpart
  pk: 8002
  fields:
    part: 8004
    supplier: 8001  # External Supplier Co (is_internal=false)
    primary: true
    SKU: 'PASSY-001'
    active: true

